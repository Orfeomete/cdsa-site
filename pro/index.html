<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CDSA Uzman Değerlendirme Çalışması</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Syne:wght@700&display=swap" rel="stylesheet">
<style>
:root{--acc:#2563eb;--ink:#1a2233;--mut:#5b6472;--line:#d9dee7;--bg:#f6f8fb;--card:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:2.2rem 1.2rem 4rem}
.top{font-size:11px;letter-spacing:0.14em;color:var(--mut);text-align:center;margin-bottom:2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2.2rem 2.4rem}
h1{font-family:'Syne',sans-serif;font-size:1.25rem;margin-bottom:1.1rem}
p.lead{font-size:1rem;line-height:1.75;margin-bottom:1.6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:1.6rem}
.hat{border:1px solid var(--line);border-radius:14px;padding:1.15rem 0.7rem;text-align:center;cursor:pointer;background:var(--card);transition:border-color .2s,transform .2s;font-family:inherit;font-size:0.95rem;font-weight:600;color:var(--ink)}
.hat:hover{border-color:var(--acc);transform:translateY(-2px)}
.guven{font-size:0.82rem;color:var(--mut);text-align:center;line-height:1.7}
.guven a{color:var(--acc)}
.prog{display:flex;gap:5px;margin-bottom:1.8rem}
.prog span{height:4px;flex:1;border-radius:2px;background:var(--line)}
.prog span.on{background:var(--acc)}
.num{font-size:2rem;font-weight:700;color:#c6cdd8;font-family:'Syne',sans-serif}
.vaka{font-size:0.9rem;font-weight:600;color:var(--mut);margin:0.2rem 0 0.6rem}
.metin{font-size:0.98rem;line-height:1.75;margin-bottom:1.4rem;max-width:58ch}
.soru{font-size:0.9rem;font-weight:600;margin:1.3rem 0 0.7rem}
.opts{display:flex;flex-direction:column;gap:8px;max-width:460px}
.opt{border:1px solid var(--line);border-radius:10px;padding:11px 15px;font-size:0.92rem;cursor:pointer;background:var(--card);text-align:left;font-family:inherit;color:var(--ink);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--acc)}
.opt.sec{border:2px solid var(--acc);background:#eef4fe;color:#1d4fbd;padding:10px 14px}
.opt.e{color:var(--mut);font-size:0.85rem}
.nav{display:flex;justify-content:space-between;margin-top:2rem;max-width:460px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 20px;font-size:0.9rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:0.4;cursor:default}
textarea{width:100%;max-width:520px;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:0.92rem;resize:vertical}
.done{text-align:center}
.done h1{margin-top:0.4rem}
.notlar{font-size:0.85rem;color:var(--mut);line-height:1.7;margin-top:1.2rem}
.uyari{background:#fff7e6;border:1px solid #f0d9a8;border-radius:10px;padding:10px 14px;font-size:0.82rem;color:#7a5a10;margin-bottom:1.4rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<div class="top">CDSA · UZMAN DEĞERLENDİRME ÇALIŞMASI</div>

</div>
<script>
const VERI = {"teknisyen": {"ad": "Bakım Teknisyeni", "davet": "Bakım kararlarını destekleyecek yeni nesil erken uyarı sistemleri tasarlanırken en kritik soru şudur. Sistem nerede susmalı ve söz nerede tamamen sizde kalmalı. Bu çalışma o sınırı, masa başında değil sizin meslek yargınızla çizmek için hazırlandı. Aşağıdaki senaryolar gerçekçi bakım durumları sunar ve sizden yalnız bir şey ister, mesleğinizi nasıl icra ediyorsanız öyle karar vermenizi.", "brif": "Değerlendireceğiniz çerçevenin adı CDSA. Tek cümleyle, bakım kararlarını destekleyen ve son sözü her durumda yetkili personelde bırakan bir erken uyarı çerçevesidir. İki ilkesi baştan sabitlenmiştir. Hiçbir kuruluşun kaydı kendi binasından çıkmaz ve sistem karar vermez, öneri sunar, önerisinin gerekçesini gösterir. Kimi senaryolarda önce sizin kararınız sorulacak, ardından sistemin aynı durumdaki önerisiyle karşılaştırmanız istenecektir. Sistemin hatalı olduğunu düşündüğünüz her nokta bu çalışmanın en değerli bulgusudur.", "karar": ["Bakım gerekmez", "Planlı bakım", "Acil bakım", "Filo geneli uyarı", "Senaryoyu anlayamadım"], "ekranlar": [{"s": 1, "b": "Vaka A — Çakışan sinyaller", "m": "Bir motorun trend izlemesi son dört uçuşta EGT marjında istikrarlı daralma gösteriyor, değerler henüz limit içinde. Aynı hafta bakım kayıt sistemine tanımsız bir USB cihazının bağlandığı raporlandı. İki olay arasında doğrulanmış bir bağ yok. Bu tabloyu değerlendirin.", "q": [{"p": "Kararınız", "o": "karar"}, {"p": "Kararınızın birincil dayanağı", "o": ["Motor trendi", "Kayıt sistemi olayı", "İkisinin aynı haftaya denk gelmesi", "Uçağın bakım geçmişi"]}]}, {"s": 1, "b": "Vaka B — Temiz tablo", "m": "Bir motorun tüm trend parametreleri son on uçuşta stabil. Kayıt sistemlerinde olağan dışı olay yok ve planlı görev paketi iki hafta sonra. Bu tabloyu değerlendirin.", "q": [{"p": "Kararınız", "o": "karar"}]}, {"s": 1, "b": "Vaka C — Sınır vakası", "m": "Titreşim kanalında aralıklı sıçramalar son altı uçuşta üç kez görüldü, her seferinde normale döndü ve başka hiçbir gösterge eşlik etmiyor. Komponent geçmişinde beş yıl önce benzer örüntüyle açılıp sonuçsuz kapanmış bir inceleme kaydı var. Bu tabloyu değerlendirin.", "q": [{"p": "Kararınız", "o": "karar"}]}, {"s": 2, "b": "Sistemle yüzleşme", "m": "Sistemin aynı üç vakadaki önerileri şöyleydi. Vaka A planlı bakım, Vaka B bakım gerekmez, Vaka C planlı bakım. Her vaka için kendi kararınızla karşılaştırın.", "q": [{"p": "Vaka A için", "o": ["Katılıyorum", "Kısmen katılıyorum", "Katılmıyorum", "Bu veriyle karar verilemez", "Senaryoyu anlayamadım"]}, {"p": "Vaka B için", "o": ["Katılıyorum", "Kısmen katılıyorum", "Katılmıyorum", "Bu veriyle karar verilemez", "Senaryoyu anlayamadım"]}, {"p": "Vaka C için", "o": ["Katılıyorum", "Kısmen katılıyorum", "Katılmıyorum", "Bu veriyle karar verilemez", "Senaryoyu anlayamadım"]}, {"p": "Sistem, Vaka A önerisinin gerekçesini şöyle gösterdi. Önerinin yüzde 62'si motor trendine, yüzde 28'i kayıt sistemine bağlanan tanımsız cihaz olayına, yüzde 10'u bakım geçmişine dayanıyor. Bu gerekçe dağılımını değerlendirin.", "o": ["Ağırlıklar makul", "Ağırlıklar hatalı", "Değerlendiremiyorum"]}, {"p": "Sistemin Vaka A'da göremediğini düşündüğünüz tek bir kaynak", "o": ["İş emri kayıtları", "Komponent geçmişi", "Vardiya ve iş yükü durumu", "Tedarik zinciri kayıtları", "Hiçbiri"]}]}, {"s": 3, "b": "Bildirim yükümlülüğü", "m": "Kalibrasyon cihazlarından birinin yazılımında yetkisiz değişiklik tespit edildi. Cihaz son yetmiş iki saatte üç uçağın tork ölçümlerinde kullanılmış. Bildirim yükümlülüğü ve uçuşa elverişlilik açısından ilk yapılması gerekeni seçin.", "q": [{"p": "İlk adım", "o": ["Yalnız iç kayıt, izleme sürdürülür", "Otoriteye bildirim ve üç uçak için kayıt incelemesi", "Otoriteye bildirim ve üç uçağın ilgili ölçümlerinin tekrarı", "Filo geneli uyarı ve cihaz karantinası", "Senaryoyu anlayamadım"]}, {"p": "Bu durumda en kritik zaman kısıtı", "o": ["Bildirim penceresi", "Bir sonraki planlı sefer", "Cihazın yeniden kullanım riski"]}]}, {"s": 4, "b": "Rakiple ortak sistem", "m": "Kuruluşunuz, iki rakip bakım kuruluşuyla ortak bir erken uyarı sistemine katılmaya davet edildi. Düzen şöyle. Hiçbir kuruluş diğerine tek bir arıza kaydı, iş emri ya da müşteri bilgisi göndermez. Her kuruluş sistemi kendi kayıtlarıyla kendi binasında eğitir, dışarıya yalnız sistemin öğrendikleri aktarılır ve bu aktarım hiçbir tekil olayın geri çıkarılamayacağı biçimde bulanıklaştırılır.", "q": [{"p": "Ticari sır açısından bu düzenin en zayıf halkası", "o": ["Öğrenilenler üzerinden rakibin bizim arıza örüntülerimizi sezmesi", "Ortak sistemin bizim zayıflıklarımızı rakibe, rakibinkileri bize öğretmesi", "Ortaklığın yönetimi ve denetimi", "Zayıf halka yok, düzen yeterli", "Senaryoyu anlayamadım"]}, {"p": "Katılım kararını kim vermeli", "o": ["Kalite ve emniyet birimi", "Üst yönetim", "Otorite onayıyla sektör genelinde", "Katılınmamalı"]}]}, {"s": 5, "b": "Eşik tercihi", "m": "Erken uyarı sistemlerinde iki hata türü vardır. Gerçek bir kritik durumu kaçırmak ve gereksiz alarm üretmek. Kendi hangar pratiğinizden düşünün.", "q": [{"p": "Bir kritik kaçağın önlenmesi için kaç gereksiz alarma katlanmak makuldür", "o": ["Beşe kadar", "Ona kadar", "Yirmiye kadar", "Sayı önemsiz, kritik kaçak asla", "Senaryoyu anlayamadım"]}, {"p": "Gereksiz alarmların pratikteki asıl maliyeti", "o": ["İş gücü ve plan bozulması", "Ekipte güven aşınması ve alarm yorgunluğu", "Kayıt ve bildirim yükü"]}]}, {"s": 6, "b": "Açıklama yeterliliği", "m": "Sistem bir iş emri önerisine şu gerekçeyi iliştirdi. Öneri, motor titreşim kanalındaki son üç uçuşluk sapmaya yüzde 71 ağırlıkla dayanmaktadır, kayıt sistemi olayının katkısı yüzde 12'dir ve benzer geçmiş vakalarda planlı bakım kararı verilmiştir.", "q": [{"p": "Bu açıklama, imzanızı taşıyacak bir bakım kaydına dayanak olarak yeterli midir", "o": ["Yeterli", "Ham veriye erişim bağlantısı da gerekli", "Benzer vakaların künyeleri de gerekli", "Hiçbir otomatik açıklama imza dayanağı olamaz", "Senaryoyu anlayamadım"]}]}, {"s": 7, "b": "Sorumluluk", "m": "Sistemin planlı bakım önerisine uyuldu ve iş emri olağan süreçte kapandı. İki hafta sonra aynı motorda, önerinin kapsamadığı bir arıza nedeniyle sefer iptali yaşandı.", "q": [{"p": "İç değerlendirmede sorumluluk nasıl ele alınmalı", "o": ["İmza sahibi personeldedir, sistem yalnız destektir", "Öneriyi doğrulayan süreçtedir, kişide değil", "Sistemi devreye alan yönetimdedir", "Bu düzende sorumluluk belirsizleşir ve bu başlı başına bir risktir", "Senaryoyu anlayamadım"]}, {"p": "Böyle bir sistemin kullanıma girmesi için vazgeçilmez koşul", "o": ["Önerilere uyma zorunluluğunun bulunmaması", "Her önerinin ikinci bir personelce doğrulanması", "Sistem kayıtlarının hiçbir biçimde kişiye karşı kullanılmayacağı güvencesi", "Otorite onaylı sertifikasyon"]}]}, {"s": 8, "b": "Hata yakalama", "m": "Sistem, yoğun sefer döneminde art arda gelen üç küçük arıza kaydını tek başına önemsiz, birlikte anlamlı bulup filo geneli uyarı önerdi. Kayıtlara baktığınızda üçünün de aynı vardiyada, aynı personel grubunun elle giriş hatasından kaynaklandığını görüyorsunuz.", "q": [{"p": "Bu vaka sistemin hangi eksiğini gösterir", "o": ["Veri kalitesi denetimi eksik", "İnsan kaynaklı kayıt örüntülerini tanımıyor", "Uyarı eşiği yanlış", "Eksik yok, ihtiyatlı davranması doğru", "Senaryoyu anlayamadım"]}]}], "profil": [{"p": "Yetki kapsamınız", "o": ["Gövde", "Motor", "Aviyonik", "Diğer"]}, {"p": "Deneyim yılınız", "o": ["5 yıldan az", "5 ile 15 arası", "15 yıldan fazla"]}, {"p": "Görev ortamınız", "o": ["Hat bakım", "Üs bakım", "Atölye", "Kalite"]}]}, "pilot": {"ad": "Pilot", "davet": "Uçuş ekibinin hazır oluşunu destekleyecek yeni nesil sistemler tasarlanırken en kritik soru şudur. Bu bilgi kimin elinde kalmalı ve söz nerede tamamen sizde olmalı. Bu çalışma o sınırı, masa başında değil sizin kokpit yargınızla çizmek için hazırlandı. Aşağıdaki senaryolar gerçekçi görev durumları sunar ve sizden yalnız bir şey ister, mesleğinizi nasıl icra ediyorsanız öyle karar vermenizi.", "brif": "Değerlendireceğiniz çerçevenin adı CDSA. Tek cümleyle, uçuş ekibinin hazır oluşuna dair göstergeleri yalnız pilotun kendi cihazında değerlendiren ve son sözü her durumda uçucu personelde bırakan bir destek çerçevesidir. İki ilkesi baştan sabitlenmiştir. Ham kayıtlar cihazdan çıkmaz, dışarıya yalnız özet gösterge yansır ve o göstergenin kime görüneceğine dair düzen baştan tanımlıdır. Sistem karar vermez, bilgi verir. Kimi senaryolarda önce sizin kararınız sorulacak, ardından sistemin aynı durumdaki değerlendirmesiyle karşılaştırmanız istenecektir. Sistemin hatalı olduğunu düşündüğünüz her nokta bu çalışmanın en değerli bulgusudur.", "karar": ["Kayda değer değil, göreve devam", "Uçuş öncesi brifingde dikkate alınır", "Görev planlamasında değişiklik istenir", "Görevden çekilme değerlendirilir", "Senaryoyu anlayamadım"], "ekranlar": [{"s": 1, "b": "Vaka A — Çakışan sinyaller", "m": "Gece seferi öncesi cihazınız dinlenme göstergenizin düşük olduğunu bildiriyor. Görev çizelgenize baktığınızda son yedi günde üç erken kalkışlı görev yaptığınızı görüyorsunuz. Kendinizi olağan hissediyorsunuz. Bu tabloyu değerlendirin.", "q": [{"p": "Kararınız", "o": "karar"}, {"p": "Kararınızın birincil dayanağı", "o": ["Cihaz göstergesi", "Görev geçmişi", "Kendi öznel değerlendirmeniz", "Sefer tipi ve ekip kompozisyonu"]}]}, {"s": 1, "b": "Vaka B — Temiz tablo", "m": "Uzun menzilli sefer öncesi tüm göstergeleriniz olağan aralıkta, görev geçmişiniz dengeli ve kendinizi iyi hissediyorsunuz. Bu tabloyu değerlendirin.", "q": [{"p": "Kararınız", "o": "karar"}]}, {"s": 1, "b": "Vaka C — Sınır vakası", "m": "Cihaz orta düzey bir dikkat göstergesi bildiriyor ancak siz kendinizi tamamen zinde hissediyorsunuz ve yakın geçmişte olağan dışı bir yük yok. Gösterge ile öz değerlendirmeniz çelişiyor. Bu tabloyu değerlendirin.", "q": [{"p": "Kararınız", "o": "karar"}]}, {"s": 2, "b": "Sistemle yüzleşme", "m": "Sistemin aynı üç vakadaki değerlendirmeleri şöyleydi. Vaka A brifingde dikkate alınır, Vaka B kayda değer değil, Vaka C brifingde dikkate alınır. Her vaka için kendi kararınızla karşılaştırın.", "q": [{"p": "Vaka A için", "o": ["Katılıyorum", "Kısmen katılıyorum", "Katılmıyorum", "Bu veriyle karar verilemez", "Senaryoyu anlayamadım"]}, {"p": "Vaka B için", "o": ["Katılıyorum", "Kısmen katılıyorum", "Katılmıyorum", "Bu veriyle karar verilemez", "Senaryoyu anlayamadım"]}, {"p": "Vaka C için", "o": ["Katılıyorum", "Kısmen katılıyorum", "Katılmıyorum", "Bu veriyle karar verilemez", "Senaryoyu anlayamadım"]}, {"p": "Sistem, Vaka A değerlendirmesinin gerekçesini şöyle gösterdi. Değerlendirmenin yüzde 58'i son yedi günlük uyku ve dinlenme kaydına, yüzde 27'si toparlanma göstergesine, yüzde 15'i görev geçmişine dayanıyor. Bu gerekçe dağılımını değerlendirin.", "o": ["Ağırlıklar makul", "Ağırlıklar hatalı", "Değerlendiremiyorum"]}, {"p": "Sistemin Vaka A'da göremediğini düşündüğünüz tek bir kaynak", "o": ["Kişisel beyanınız", "Ekip eşleşmesi ve kokpit deneyim dengesi", "Sefer ve meydan zorluğu", "Özel yaşam koşulları", "Hiçbiri"]}]}, {"s": 3, "b": "Elverişlilik beyanı", "m": "Görev öncesi cihazınız düşük hazır oluş bildiriyor ancak siz kendinizi göreve elverişli değerlendiriyorsunuz. Mevcut düzenlemelerde elverişlilik beyanı size aittir.", "q": [{"p": "Bu çelişki durumunda ilk adım", "o": ["Beyanım esastır, göstergeyi kayda geçirip göreve devam ederim", "Göstergeyi kaptan veya ekip arkadaşımla paylaşır birlikte değerlendiririm", "Uçuş işletme veya ekip planlama ile temas kurarım", "Uçuş hekimine danışırım", "Senaryoyu anlayamadım"]}, {"p": "Bu göstergenin varlığı elverişlilik beyanının niteliğini değiştirir mi", "o": ["Değiştirmez, beyan esastır", "Beyanı güçlendiren bir dayanaktır", "Beyanla çeliştiğinde açıklama yükü doğurur"]}]}, {"s": 4, "b": "Kayıtların emaneti", "m": "Cihazınızın ham kayıtları şifreli bir arşivde tutuluyor ve ancak üç taraftan ikisinin anahtarıyla açılabiliyor. Soruşturma kurulu, pilot temsil örgütü ve adli merci. Hiçbir taraf tek başına açamıyor.", "q": [{"p": "Bir kaza soruşturması senaryosunda bu düzenin en güçlü yanı", "o": ["Tek tarafın kötüye kullanımını engellemesi", "Pilot temsilinin masada olması", "Açılmanın kayıt altında ve gerekçeli olması", "Güçlü yanı yok, kayıt hiç tutulmamalı", "Senaryoyu anlayamadım"]}, {"p": "Aynı düzenin çözmediği risk", "o": ["Açılan verinin bağlamından koparılması", "İşverenin dolaylı baskısı", "Uzun vadede kapsamın genişlemesi", "Çözmediği risk yok"]}]}, {"s": 5, "b": "Eşik tercihi", "m": "Hazır oluş sistemlerinde iki hata türü vardır. Gerçekten elverişsiz bir durumu kaçırmak ve gereksiz uyarı üretmek. Kendi görev pratiğinizden düşünün.", "q": [{"p": "Gerçek bir elverişsizliğin yakalanması için kaç gereksiz uyarıya katlanmak makuldür", "o": ["Beşe kadar", "Ona kadar", "Yirmiye kadar", "Sayı önemsiz, gerçek elverişsizlik asla kaçmamalı", "Senaryoyu anlayamadım"]}, {"p": "Gereksiz uyarıların pratikteki asıl maliyeti", "o": ["Görev akışının bozulması", "Göstergeye güvenin aşınması", "Etiketlenme ve gözetim algısı"]}]}, {"s": 6, "b": "Açıklama yeterliliği", "m": "Sistem brifing kartınıza şu notu ekledi. Dikkat göstergesi, son yetmiş iki saatteki dinlenme düzenindeki bölünmeye yüzde 64 ağırlıkla dayanmaktadır ve benzer örüntülerde gece görevlerinde tepki süresi uzaması gözlenmiştir.", "q": [{"p": "Bu açıklama, görev kararınıza dayanak olarak yeterli midir", "o": ["Yeterli", "Kendi kayıtlarıma erişim bağlantısı da gerekli", "Benzer örüntü iddiasının dayanağı da gerekli", "Hiçbir otomatik açıklama tek başına dayanak olamaz", "Senaryoyu anlayamadım"]}]}, {"s": 7, "b": "Sorumluluk", "m": "Cihaz düşük hazır oluş bildirdi, siz beyanınızla göreve devam ettiniz ve uçuşta operasyonel bir olay yaşandı.", "q": [{"p": "Soruşturmada bu kayıt nasıl ele alınmalı", "o": ["Hiç kullanılmamalı, beyan esastır", "Yalnız eğilim ve sistem gelişimi için, kişisel değerlendirmede değil", "Ancak emanet düzeninin onayıyla ve bağlamıyla birlikte", "Bu belirsizlik çö ayamadım"]}]}], "profil": [{"p": "Derece ve yetki kapsamınız", "o": ["Meydan", "Yaklaşma", "Saha"]}, {"p": "Deneyim yılınız", "o": ["5 yıldan az", "5 ile 15 arası", "15 yıldan fazla"]}, {"p": "Ünite tipiniz", "o": ["Kule", "Yaklaşma ünitesi", "Saha kontrol merkezi"]}]}, "dispecer": {"ad": "Uçuş Harekât Uzmanı", "davet": "Uçuş harekât kararlarını destekleyecek yeni nesil sistemler tasarlanırken en kritik soru şudur. Sistem nerede susmalı ve söz nerede tamamen sizde kalmalı. Bu çalışma o sınırı, masa başında değil sizin harekât yargınızla çizmek için hazırlandı. Aşağıdaki senaryolar gerçekçi sevk durumları sunar ve sizden yalnız bir şey ister, mesleğinizi nasıl icra ediyorsanız öyle karar vermenizi.", "brif": "Değerlendireceğiniz çerçevenin adı CDSA. Tek cümleyle, sevk ve harekât kararlarını destekleyen ve son sözü her durumda yetkili dispeçer ile kaptanda bırakan bir erken uyarı çerçevesidir. İki ilkesi baştan sabitlenmiştir. Hiçbir işletmenin operasyonel kaydı kendi sınırından çıkmaz ve sistem karar vermez, öneri sunar, önerisinin gerekçesini gösterir. Kimi senaryolarda önce sizin kararınız sorulacak, ardından sistemin aynı durumdaki önerisiyle karşılaştırmanız istenecektir. Sistemin hatalı olduğunu düşündüğünüz her nokta bu çalışmanın en değerli bulgusudur.", "karar": ["Planlandığı gibi serbest bırakılır", "Yakıt veya yedek meydan revizesiyle serbest bırakılır", "Kalkış ertelenir", "Sefer iptali önerilir", "Senaryoyu anlayamadım"], "ekranlar": [{"s": 1, "b": "Vaka A — Çakışan sinyaller", "m": "Varış meydanının hava raporu minimumlara yakın seyrediyor ve düzelme eğilimi belirsiz. Aynı uçağın arıza erteleme listesinde, yaklaşma kabiliyetini bir kademe düşüren bir kısıt mevcut. Bu tabloyu değerlendirin.", "q": [{"p": "Kararınız", "o": "karar"}, {"p": "Kararınızın birincil dayanağı", "o": ["Hava eğilimi", "Erteleme kısıtı", "İkisinin birleşimi", "Yedek meydan durumu"]}]}, {"s": 1, "b": "Vaka B — Temiz tablo", "m": "Hava raporları tüm meydanlarda elverişli, uçak kısıtsız ve ekip görev süreleri rahat. Bu tabloyu değerlendirin.", "q": [{"p": "Kararınız", "o": "karar"}]}, {"s": 1, "b": "Vaka C — Sınır vakası", "m": "İki ayrı kaynaktan alınan varış rüzgâr tahminleri birbiriyle çelişiyor ve fark, iniş performans hesabını etkileyecek büyüklükte. Diğer tüm veriler olağan. Bu tabloyu değerlendirin.", "q": [{"p": "Kararınız", "o": "karar"}]}, {"s": 2, "b": "Sistemle yüzleşme", "m": "Sistemin aynı üç vakadaki önerileri şöyleydi. Vaka A yakıt ve yedek meydan revizesiyle serbest bırakma, Vaka B planlandığı gibi serbest bırakma, Vaka C revizeyle serbest bırakma. Her vaka için kendi kararınızla karşılaştırın.", "q": [{"p": "Vaka A için", "o": ["Katılıyorum", "Kısmen katılıyorum", "Katılmıyorum", "Bu veriyle karar verilemez", "Senaryoyu anlayamadım"]}, {"p": "Vaka B için", "o": ["Katılıyorum", "Kısmen katılıyorum", "Katılmıyorum", "Bu veriyle karar verilemez", "Senaryoyu anlayamadım"]}, {"p": "Vaka C için", "o": ["Katılıyorum", "Kısmen katılıyorum", "Katılmıyorum", "Bu veriyle karar verilemez", "Senaryoyu anlayamadım"]}, {"p": "Sistem, Vaka A önerisinin gerekçesini şöyle gösterdi. Önerinin yüzde 52'si hava eğilimine, yüzde 33'ü erteleme kısıtına, yüzde 15'i yedek meydan durumuna dayanıyor. Bu gerekçe dağılımını değerlendirin.", "o": ["Ağırlıklar makul", "Ağırlıklar hatalı", "Değerlendiremiyorum"]}, {"p": "Sistemin Vaka A'da göremediğini düşündüğünüz tek bir kaynak", "o": ["Ekip görev süresi", "Slot ve trafik durumu", "Yolcu ve bağlantı yapısı", "Yer hizmet kapasitesi", "Hiçbiri"]}]}, {"s": 3, "b": "Görüş ayrılığı", "m": "Vaka A'da siz revize gerektiğini değerlendiriyorsunuz, kaptan planlandığı gibi devam edilebileceği görüşünde.", "q": [{"p": "Operasyonel kontrol açısından ilk adım", "o": ["Kaptanın nihai yetkisi esastır, kayıt düşerek devam edilir", "Ortak değerlendirme yapılır ve gerekçeler kayda geçirilir", "Uçuş harekât yönetimine taşınır", "Serbest bırakma ortak imza olmadan tamamlanmaz", "Senaryoyu anlayamadım"]}, {"p": "Görüş ayrılıklarında sistemin önerisi nasıl konumlanmalı", "o": ["Tarafsız üçüncü görüş", "Yalnız veri sağlayıcı", "Hiç konumlanmamalı"]}]}, {"s": 4, "b": "İşletmeler arası ortak sistem", "m": "İşletmeniz, iki rakip işletmeyle ortak bir aksama erken uyarı sistemine katılmaya davet edildi. Düzen şöyle. Hiçbir işletme diğerine tek bir sefer kaydı, gecikme nedeni ya da ticari bilgi göndermez. Her işletme sistemi kendi kayıtlarıyla kendi merkezinde eğitir, dışarıya yalnız sistemin öğrendikleri aktarılır ve bu aktarım hiçbir tekil seferin geri çıkarılamayacağı biçimde bulanıklaştırılır.", "q": [{"p": "Ticari açıdan bu düzenin en zayıf halkası", "o": ["Öğrenilenler üzerinden rakibin operasyon zayıflıklarımızı sezmesi", "Ortak sistemin ağ yapımızı dolaylı yansıtması", "Ortaklığın yönetimi ve denetimi", "Zayıf halka yok, düzen yeterli", "Senaryoyu anlayamadım"]}, {"p": "Katılım kararını kim vermeli", "o": ["Harekât yönetimi", "Üst yönetim", "Otorite onayıyla sektör genelinde", "Katılınmamalı"]}]}, {"s": 5, "b": "Eşik tercihi", "m": "Erken uyarı sistemlerinde iki hata türü vardır. Gerçek bir kritik durumu kaçırmak ve gereksiz uyarı üretmek. Kendi sevk pratiğinizden düşünün.", "q": [{"p": "Bir kritik kaçağın önlenmesi için kaç gereksiz uyarıya katlanmak makuldür", "o": ["Beşe kadar", "Ona kadar", "Yirmiye kadar", "Sayı önemsiz, kritik kaçak asla", "Senaryoyu anlayamadım"]}, {"p": "Gereksiz uyarıların pratikteki asıl maliyeti", "o": ["Gereksiz erteleme ve ağ etkisi", "Uyarıya güvenin aşınması", "İş yükü ve kayıt yükü"]}]}, {"s": 6, "b": "Açıklama yeterliliği", "m": "Sistem serbest bırakma ekranına şu gerekçeyi düşürdü. Revize önerisi, varış meydanı eğilim verisindeki bozulmaya yüzde 61 ağırlıkla dayanmaktadır ve benzer eğilimlerde yedek meydana yönelme oranı belirgin biçimde artmıştır.", "q": [{"p": "Bu açıklama, imzanızı taşıyacak bir sevk kararına dayanak olarak yeterli midir", "o": ["Yeterli", "Eğilim verisinin kaynağı ve saati de gerekli", "Benzer eğilim iddiasının dayanağı da gerekli", "Hiçbir otomatik açıklama imza dayanağı olamaz", "Senaryoyu anlayamadım"]}]}, {"s": 7, "b": "Sorumluluk", "m": "Sistemin planlandığı gibi serbest bırakma önerisine uyuldu ve sefer, varışta beklenmedik bozulma nedeniyle yedek meydana yöneldi.", "q": [{"p": "İç değerlendirmede sorumluluk nasıl ele alınmalı", "o": ["İmza sahibi dispeçerdedir, sistem yalnız destektir", "Kararı doğrulayan süreçtedir, kişide değil", "Sistemi devreye alan yönetimdedir", "Bu düzende sorumluluk belirsizleşir ve bu başlı başına bir risktir", "Senaryoyu anlayamadım"]}, {"p": "Böyle bir sistemin harekât merkezine girmesi için vazgeçilmez koşul", "o": ["Önerilere uyma zorunluluğunun bulunmaması", "Her önerinin ikinci bir gözle doğrulanması", "Kayıtların kişiye karşı kullanılmayacağı güvencesi", "Otorite onaylı sertifikasyon"]}]}, {"s": 8, "b": "Hata yakalama", "m": "Sistem, yürürlükten kalkmış bir meydan duyurusunu aktif sanarak sefer iptali önerdi. Duyurunun iptali bir gün önce yayımlanmıştı.", "q": [{"p": "Bu vaka sistemin hangi eksiğini gösterir", "o": ["Duyuru güncelliğini doğrulamıyor", "Kaynaklar arasında çapraz kontrol yapmıyor", "İptal eşiği yanlış", "Eksik yok, ihtiyatlı davranması doğru", "Senaryoyu anlayamadım"]}]}], "profil": [{"p": "Lisans durumunuz", "o": ["Uçuş harekât uzmanı lisansı", "Diğer"]}, {"p": "Deneyim yılınız", "o": ["5 yıldan az", "5 ile 15 arası", "15 yıldan fazla"]}, {"p": "Operasyon türünüz", "o": ["Tarifeli", "Tarifesiz", "Kargo", "Genel havacılık"]}]}};
const ENDPOINT = "";
const app=document.getElementById('app');
let hat=null, idx=-1, cevap={}, sonsoz="", profil={}, uygun=null;

const HATLAR=[["pilot","Pilot"],["teknisyen","Teknisyen"],["kontrolor","Kontrolör"],["dispecer","Dispeçer"]];

function kapi(){
 let k='';
 for(const [id,ad] of HATLAR) k+=`<button class="hat" onclick="basla('${id}')">${ad}</button>`;
 app.innerHTML=`<div class="card">
  ${ENDPOINT?'':'<div class="uyari">Önizleme sürümü. Bu sürümde yanıtlar kaydedilmez.</div>'}
  <p class="lead">Yeni nesil erken uyarı sistemleri tasarlanırken en kritik soru şudur. Sistem nerede susmalı ve söz nerede tamamen sizde kalmalı. Bu çalışma o sınırı, masa başında değil sizin meslek yargınızla çizmek için hazırlandı. Çalışma, hâlen geçerli lisansa sahip, aktif görev yapan ve kendi alanında bağımsız karar yetkisi taşıyan profesyonellere yöneliktir. Mesleğinizi seçerek başlayabilirsiniz.</p>
  <div class="grid">${k}</div>
  <p class="guven">Kimlik toplanmaz · Süre yaklaşık 18 dakika · Katılım gönüllüdür ve etik kurul onaylıdır<br>
  Bu çalışma CDSA araştırma programının parçasıdır ve programı <a href="https://cdsa.app">cdsa.app</a> adresinde inceleyebilirsiniz. Yargınızın etkilenmemesi için incelemeyi değerlendirme sonrasına bırakmanızı öneririz.</p>
 </div>`;
}

function basla(h){hat=h; idx=-1; cevap={}; uygunluk();}

function uygunluk(){
 const V=VERI[hat];
 const OZEL={pilot:["Geçerli lisansım var ve aktif uçuş görevi yapıyorum","Lisans eğitimi görüyorum ya da öğrenci pilot durumundayım",null],
             kontrolor:["Geçerli lisansım var ve aktif kontrol görevi yapıyorum","Lisans eğitimi görüyorum ya da öğrenci kontrolör durumundayım",null],
             teknisyen:["Geçerli lisansım var, aktif görev yapıyorum ve bakım çıkış belgesi imzalama yetkim var","Lisans eğitimi görüyorum ya da aday durumundayım","Görevimi yürütüyorum ancak bakım çıkış belgesi imzalama yetkim bulunmuyor"],
             dispecer:["Geçerli lisansım var, aktif görev yapıyorum ve uçuşun serbest bırakılmasında imza yetkim var","Lisans eğitimi görüyorum ya da aday durumundayım","Görevimi yürütüyorum ancak uçuşun serbest bırakılmasında imza yetkim bulunmuyor"]}[hat];
 const o=[["aktif",OZEL[0]],
          ["ogrenci",OZEL[1]],
          ["pasif","Lisansım var ancak uzun süredir aktif görev yapmıyorum"],
          ["askida","Lisansım askıda ya da süresi dolmuş"]];
 if(OZEL[2]) o.push(["yetkisiz",OZEL[2]]);
 let k='';
 o.forEach(([kod,ad])=>{k+=`<button class="opt" onclick="uygunlukSec('${kod}')">${ad}</button>`;});
 app.innerHTML=`<div class="card">
  <h1>${V.ad} hattı</h1>
  <p class="metin">Bu çalışma, hâlen geçerli lisansa sahip, aktif görev yapan ve kendi alanında bağımsız karar yetkisi taşıyan profesyonellere yöneliktir. Durumunuzu en iyi tanımlayan seçeneği işaretleyiniz.</p>
  <div class="opts">${k}</div>
  <div class="nav"><button class="btn" onclick="kapi()">Geri</button></div>
 </div>`;
 window.scrollTo(0,0);
}

function uygunlukSec(kod){
 if(kod==='aktif'){ uygun='aktif'; goster(true); return; }
 app.innerHTML=`<div class="card done">
  <h1>Katkınız için teşekkür ederiz</h1>
  <p class="metin" style="margin:0 auto 1rem;max-width:48ch">Bu çalışma, güncel operasyonel pratikten türeyen uzman yargısını toplamayı amaçlamaktadır. Bu nedenle yalnız kendi alanında bağımsız karar ve imza yetkisini hâlen taşıyan lisanslı profesyonellere açıktır. Ölçüt kişisel yeterlilikle değil, yanıtların hangi karar konumundan geldiğiyle ilgilidir. İlginiz bizim için değerlidir.</p>
  <p class="notlar"><a href="https://cdsa.app" style="color:var(--acc)">Çalışmanın arkasındaki programı incelemek isterseniz</a></p>
  <div class="nav" style="justify-content:center"><button class="btn" onclick="kapi()">Başa dön</button></div>
 </div>`;
 window.scrollTo(0,0);
}

function goster(kaydir){
 const V=VERI[hat];
 if(idx===-1){
  app.innerHTML=`<div class="card">
   <h1>${V.ad} hattı</h1>
   <p class="metin">${V.davet}</p>
   <p class="metin" style="color:var(--mut)">${V.brif}</p>
   <div class="nav"><button class="btn" onclick="kapi()">Geri</button><button class="btn pri" onclick="idx=0;goster(true)">Başla</button></div>
  </div>`;
  if(kaydir!==false)window.scrollTo(0,0); return;
 }
 const eks=V.ekranlar;
 if(idx>=eks.length){ sonEkran(kaydir); return; }
 const e=eks[idx];
 let prog='';
 for(let s=1;s<=8;s++) prog+=`<span class="${e.s>=s?'on':''}"></span>`;
 let sorular='';
 e.q.forEach((q,qi)=>{
  const opts=(q.o==='karar')?V.karar:q.o;
  const key=idx+'_'+qi;
  let o='';
  opts.forEach((op,oi)=>{
   const sec=cevap[key]===oi?'sec':'';
   const eklas=op==='Senaryoyu anlayamadım'?'e':'';
   o+=`<button class="opt ${sec} ${eklas}" onclick="sec('${key}',${oi})">${op}</button>`;
  });
  sorular+=`<div class="soru">${q.p}</div><div class="opts">${o}</div>`;
 });
 const tamam=e.q.every((q,qi)=>cevap[idx+'_'+qi]!==undefined);
 app.innerHTML=`<div class="card">
  <div class="prog">${prog}</div>
  <div style="display:flex;gap:16px;align-items:baseline"><span class="num">${String(e.s).padStart(2,'0')}</span>
  <div style="flex:1"><div class="vaka">${e.b}</div>
  <p class="metin">${e.m}</p>
  ${sorular}
  <div class="nav"><button class="btn" onclick="geri()">Geri</button><button class="btn pri" ${tamam?'':'disabled'} onclick="ileri()">Devam</button></div>
  </div></div>
 </div>`;
 if(kaydir!==false)window.scrollTo(0,0);
}

function sec(key,oi){cevap[key]=oi; goster(false);}
function geri(){ if(idx<=0){idx=-1;}else{idx--;} goster(true); }
function ileri(){ idx++; goster(true); }

function sonEkran(kaydir){
 const V=VERI[hat];
 let prof='';
 V.profil.forEach((q,qi)=>{
  let o='';
  q.o.forEach((op,oi)=>{
   const sec=profil[qi]===oi?'sec':'';
   o+=`<button class="opt ${sec}" onclick="profil[${qi}]=${oi};const t=document.getElementById('ss');if(t)sonsoz=t.value;sonEkran(false)">${op}</button>`;
  });
  prof+=`<div class="soru">${q.p}</div><div class="opts" style="flex-direction:row;flex-wrap:wrap">${o}</div>`;
 });
 app.innerHTML=`<div class="card">
  <div class="prog"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span></div>
  <h1>Son adım</h1>
  <p class="metin" style="color:var(--mut)">Aşağıdaki bilgiler kimliksizdir ve yalnız sonuçların meslek grubu düzeyinde raporlanması için kullanılır.</p>
  ${prof}
  <div class="soru">Bu çalışmayı hazırlayanlara sormak ya da söylemek istediğiniz bir şey varsa bu alan sizindir</div>
  <textarea id="ss" placeholder="İsteğe bağlı">${sonsoz}</textarea>
  <div class="nav"><button class="btn" onclick="idx--;sonsoz=document.getElementById('ss').value;goster()">Geri</button><button class="btn pri" onclick="bitir()">Tamamla</button></div>
 </div>`;
 if(kaydir!==false)window.scrollTo(0,0);
}

function bitir(){
 sonsoz=document.getElementById('ss').value;
 const kayit={hat:hat,uygunluk:uygun,cevaplar:cevap,profil:profil,sonsoz:sonsoz,zaman:new Date().toISOString()};
 if(ENDPOINT){
  fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(kayit)}).catch(()=>{});
 }
 app.innerHTML=`<div class="card done">
  <h1>${ENDPOINT?'Değerlendirmeniz kaydedildi':'Değerlendirme tamamlandı'}</h1>
  <p class="metin" style="margin:0 auto 1rem;max-width:46ch">Meslek yargınız bu çalışmanın en değerli girdisidir. Katkınız için teşekkür ederiz.</p>
  ${ENDPOINT?'':'<p class="notlar">Önizleme sürümü. Yanıtlarınız kaydedilmedi.</p>'}
  <p class="notlar"><a href="https://cdsa.app" style="color:var(--acc)">Bu çalışmanın arkasındaki programı merak ediyorsanız</a></p>
 </div>`;
 window.scrollTo(0,0);
}

const qs=new URLSearchParams(location.search).get('hat');
if(qs && VERI[qs]){ basla(qs); } else { kapi(); }
</script>
</body>
</html>
